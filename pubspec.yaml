name: livescore
description: LiveScore - Ottieni rapidamente lo spartito del pezzo eseguito in jam session
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # File System & Paths
  path_provider: ^2.1.2
  path: ^1.9.0

  # Database (SQLite con FTS5)
  sqflite: ^2.3.3+1

  # SQLite per piattaforme specifiche
  sqlite3_flutter_libs: ^0.5.4     # Per Android/iOS (nativo)
  sqflite_common_ffi: ^2.4.0       # Per Android FFI (opzionale)

  # File Operations
  file_picker: ^10.3.7
  open_file: ^3.4.3

  # CSV Processing
  csv: ^6.0.0

  # Network & URLs
  url_launcher: ^6.2.3
  http: ^1.2.1

  # Localization & Date
  intl: ^0.19.0

  # Permissions
  permission_handler: ^12.0.1

  # Speech to Text
  speech_to_text: ^7.3.0

  # UI Components
  data_table_2: ^2.5.0

  # PDF Viewing
  flutter_pdfview: ^1.3.2

  # Device Information
  device_info_plus: ^10.1.0

  # Storage
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lints: 6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/databases/VecchioDb.db  # AGGIUNTO: database di asset