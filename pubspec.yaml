name: jamsetgemini
description: "App per ricerca spartiti"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  sqlite3_flutter_libs: ^0.5.4
  sqflite_common_ffi: ^2.4.0
  file_picker: ^10.3.7
  open_file: ^3.4.3
  csv: ^6.0.0
  url_launcher: ^6.2.3
  http: ^1.2.1
  intl: ^0.19.0
  permission_handler: ^12.0.1
  speech_to_text: ^7.3.0
  data_table_2: ^2.5.0  # Dipendenza mancante

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lints: 6.0.0  # Aggiornato per compatibilità

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/databases/